name: webrom-downloader
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ytdlbot
      POSTGRES_USER: ytdlbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytdlbot -d ytdlbot"]
      interval: 5s
      timeout: 3s
      retries: 20
  telegram-api:
    image: aiogram/telegram-bot-api:latest
    profiles: [telegram]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
  app:
    profiles: [server]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ADDR: 0.0.0.0:8095
      DATABASE_URL: postgres://ytdlbot:${POSTGRES_PASSWORD}@postgres:5432/ytdlbot?sslmode=disable
      TELEGRAM_API_URL: http://telegram-api:8081
      DATA_DIR: /data
      YTDLP_PATH: yt-dlp
      GALLERYDL_PATH: gallery-dl
      FFMPEG_PATH: ffmpeg
    ports:
      - "127.0.0.1:8095:8095"
    volumes:
      - appdata:/data
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 6g
    cpus: 2
volumes:
  pgdata:
  telegram-data:
  appdata:
